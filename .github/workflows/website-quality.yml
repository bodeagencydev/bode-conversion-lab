name: Website build and route checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, design-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production website
        run: npm run build
      - name: Verify routes and SEO output
        run: npm run check:build
